<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Form (Standalone)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel" data-presets="react">
      const { useState } = React;

      // === Form configuration object ===========================================
      // Each field is fully driven by this array. `className` is the single
      // property controlling the input's CSS classes.
      const signupFormConfig = [
        {
          name: 'fullName',
          label: 'Full Name',
          type: 'text',
          placeholder: 'Jane Doe',
          required: true,
          minLength: 2,
          maxLength: 60,
          className: 'form-control form-control-lg',
          autoComplete: 'name',
        },
        {
          name: 'email',
          label: 'Email',
          type: 'email',
          placeholder: 'you@example.com',
          required: true,
          helpText: "We'll never share your email.",
          className: 'form-control',
          autoComplete: 'email',
        },
        {
          name: 'password',
          label: 'Password',
          type: 'password',
          required: true,
          minLength: 8,
          helpText: 'At least 8 characters.',
          className: 'form-control',
          autoComplete: 'new-password',
        },
        {
          name: 'age',
          label: 'Age',
          type: 'number',
          placeholder: '18',
          required: true,
          min: 13,
          max: 120,
          className: 'form-control',
        },
      ];

      // === DynamicForm component ==============================================
      function DynamicForm({ fields, onSubmit, submitLabel = 'Submit' }) {
        const initial = fields.reduce((acc, f) => {
          acc[f.name] = f.defaultValue ?? '';
          return acc;
        }, {});

        const [values, setValues] = useState(initial);
        const [errors, setErrors] = useState({});

        const handleChange = (name, value) => {
          setValues((prev) => ({ ...prev, [name]: value }));
          if (errors[name]) setErrors((prev) => ({ ...prev, [name]: undefined }));
        };

        const validate = () => {
          const next = {};
          fields.forEach((f) => {
            const v = values[f.name];
            if (f.required && (v === '' || v == null)) {
              next[f.name] = `${f.label || f.name} is required`;
              return;
            }
            if (v !== '' && f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
              next[f.name] = 'Enter a valid email address';
            }
            if (v !== '' && f.type === 'number') {
              const n = Number(v);
              if (f.min !== undefined && n < f.min) next[f.name] = `Must be ≥ ${f.min}`;
              if (f.max !== undefined && n > f.max) next[f.name] = `Must be ≤ ${f.max}`;
            }
            if (v !== '' && f.minLength !== undefined && String(v).length < f.minLength) {
              next[f.name] = `Must be at least ${f.minLength} characters`;
            }
          });
          setErrors(next);
          return Object.keys(next).length === 0;
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          if (validate()) onSubmit?.(values);
        };

        return (
          <form onSubmit={handleSubmit} noValidate>
            {fields.map((f) => {
              const hasError = Boolean(errors[f.name]);
              const inputClass = `${f.className || 'form-control'}${hasError ? ' is-invalid' : ''}`;
              return (
                <div className="mb-3" key={f.name}>
                  <label htmlFor={f.name} className="form-label">
                    {f.label}
                    {f.required && <span className="text-danger ms-1">*</span>}
                  </label>
                  <input
                    id={f.name}
                    name={f.name}
                    type={f.type}
                    className={inputClass}
                    placeholder={f.placeholder}
                    value={values[f.name]}
                    onChange={(e) => handleChange(f.name, e.target.value)}
                    min={f.min}
                    max={f.max}
                    minLength={f.minLength}
                    maxLength={f.maxLength}
                    autoComplete={f.autoComplete}
                  />
                  {f.helpText && !hasError && (
                    <div className="form-text">{f.helpText}</div>
                  )}
                  {hasError && <div className="invalid-feedback">{errors[f.name]}</div>}
                </div>
              );
            })}
            <button type="submit" className="btn btn-primary">
              {submitLabel}
            </button>
          </form>
        );
      }

      // === App ===============================================================
      function App() {
        const [submitted, setSubmitted] = useState(null);

        return (
          <div className="container py-5" style={{ maxWidth: 640 }}>
            <div className="card shadow-sm">
              <div className="card-body">
                <h1 className="h4 mb-4">Sign Up</h1>
                <DynamicForm
                  fields={signupFormConfig}
                  submitLabel="Create account"
                  onSubmit={(values) => setSubmitted(values)}
                />
              </div>
            </div>

            {submitted && (
              <div className="alert alert-success mt-4" role="alert">
                <strong>Submitted values:</strong>
                <pre className="mb-0 mt-2">{JSON.stringify(submitted, null, 2)}</pre>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
